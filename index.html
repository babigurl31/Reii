<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rei 🌸</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nhat_ky.css">
    <link rel="stylesheet" href="progress.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div class="header">
        <h1>
            <span id="siteTitle" style="cursor: pointer;" title="Nhấn đúp để đổi tên">Rei</span> 
            <span class="secret-flower" id="secretTrigger" title="Chỉ là bông hoa thôi... đúng không?">🌸</span>
        </h1>
        <div class="clock-box" id="vnClock">Đang tải giờ...</div>
        <div class="goal-container">
            <span class="goal-text" id="myGoal" style="cursor: pointer;" title="Nhấn đúp để chỉnh sửa">Mục tiêu: Kiếm việc! Kiếm 100 triệu đầu tiên!</span>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn" id="tabFocusBtn">Trạm Tập Trung</button>
        <button class="tab-btn active" id="tabDailyBtn">Việc Hôm Nay</button>
        <button class="tab-btn" id="tabWeeklyBtn">Kế Hoạch Tuần</button>
        <button class="tab-btn" id="tabMonthlyBtn">Lịch Quan Trọng</button>
    </div>
<div id="focusTab" class="tab-content" style="background: transparent; box-shadow: none; text-align: center; padding-bottom: 50px;">
        
        <button id="btnManualFocus" style="background: transparent; border: none; cursor: pointer; margin-top: 20px; transition: 0.3s;" title="Mở bộ đếm giờ">
            <img src="icon-pomodoro.png" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
        </button>

        <div id="pomodoroUI" style="margin-top: 30px; display: flex; flex-direction: column; align-items: center; opacity: 0; transition: opacity 0.5s; pointer-events: none;">
            <div id="focusTaskName" style="font-size: 20px; font-weight: bold; color: var(--accent); background: rgba(255,255,255,0.7); padding: 10px 30px; border-radius: 30px; backdrop-filter: blur(10px); border: 1px solid var(--border); margin-bottom: 20px;">
                Chọn việc để Focus nhé Babi!
            </div>
            
            <div id="timerDisplay" style="font-size: 110px; font-weight: 800; color: var(--text-main); text-shadow: 2px 2px 15px rgba(255,255,255,0.9); line-height: 1;">
                25:00
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button id="btnTimerStart" style="padding: 12px 30px; border-radius: 30px; background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">Bắt đầu</button>
                <button id="btnTimerPause" style="padding: 12px 30px; border-radius: 30px; background: rgba(255,255,255,0.8); color: var(--text-main); border: 1px solid var(--border); font-weight: bold; cursor: pointer; font-size: 16px;">Tạm dừng</button>
                <button id="btnTimerStop" style="padding: 12px 30px; border-radius: 30px; background: var(--red); color: white; border: none; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">Dừng hẳn</button>
            </div>
        </div>

        <div style="margin-top: 50px;">
            <button id="btnExitFocus" style="padding: 10px 25px; border-radius: 30px; background: rgba(255,255,255,0.5); backdrop-filter: blur(10px); border: 1px solid var(--border); font-weight: bold; cursor: pointer; color: var(--text-main); transition: 0.3s;">
                🔙 Quay lại Kế hoạch
            </button>
        </div>

    </div>
    <div id="daily" class="tab-content active">
        <div class="input-row">
            <input type="text" id="dailyInput" class="input-item" placeholder="Hôm nay cần làm gì Babi ơi?">
            <input type="time" id="dailyTime" class="input-time">
            <select id="dailyPrio" class="input-prio">
                <option value="high">🔴 Quan trọng</option>
                <option value="medium" selected>🟡 Trong 12 tiếng</option>
                <option value="low">🔵 Trong ngày</option>
            </select>
            <button class="btn-add-main" id="btnDailyAdd">Thêm</button>
        </div>
        <div id="dailyList"></div>
        <div class="history-section">
            <button class="history-btn" id="btnToggleHistory">👁️ Xem / Ẩn lịch sử công việc đã xóa</button>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <div id="weekly" class="tab-content">
        <div class="weekly-grid" id="weekGrid"></div>
    </div>

    <div id="monthly" class="tab-content">
        <div class="cal-nav">
            <button id="btnPrevMonth">◀ Trước</button>
            <h3 id="monthYearDisplay" style="color: var(--accent); margin: 0 20px;">Tháng ...</h3>
            <button id="btnNextMonth">Sau ▶</button>
        </div>
        <div class="calendar-grid" id="calGrid"></div>
    </div>

    <div id="circleProgressContainer" class="circle-progress-wrapper"></div>
    
    <div id="wkModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="wkModalTitle">Thêm việc mới</h3>
            <input type="text" id="wkInput" class="input-item" placeholder="Tên công việc...">
            <div style="display: flex; gap: 10px;">
                <input type="time" id="wkTime" class="input-time" style="flex: 1;">
                <select id="wkPrio" class="input-prio" style="flex: 1;">
                    <option value="high">🔴 Quan trọng</option>
                    <option value="medium" selected>🟡 Cần thiết</option>
                    <option value="low">🔵 Có thể delay</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-add-main" style="flex: 1;" id="btnWkSave">Lưu</button>
                <button class="btn-add-main" style="flex: 1; background: #999;" id="btnWkCancel">Hủy</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="timer.js"></script>
    <script src="progress.js"></script>
    <script src="nhat_ky.js"></script>
    <script src="list.js"></script>
    <script src="theme.js"></script>
    <script src="focus.js"></script>
</body>
</html>
