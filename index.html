<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rei 🌸</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nhat_ky.css">
    <link rel="stylesheet" href="progress.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div class="header">
        <h1>
            <span id="siteTitle" style="cursor: pointer;" title="Nhấn đúp để đổi tên">Rei</span> 
            <span class="secret-flower" id="secretTrigger" title="Chỉ là bông hoa thôi... đúng không?">🌸</span>
        </h1>
        <div class="clock-box" id="vnClock">Đang tải giờ...</div>
        <div class="goal-container">
            <span class="goal-text" id="myGoal" style="cursor: pointer;" title="Nhấn đúp để chỉnh sửa">Mục tiêu: Kiếm việc! Kiếm 100 triệu đầu tiên!</span>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn" id="tabFocusBtn">Trạm Tập Trung</button>
        <button class="tab-btn active" id="tabDailyBtn">Việc Hôm Nay</button>
        <button class="tab-btn" id="tabWeeklyBtn">Kế Hoạch Tuần</button>
        <button class="tab-btn" id="tabMonthlyBtn">Lịch Quan Trọng</button>
        <button class="tab-btn" id="tabSummaryBtn">Tổng Hợp</button>
    </div>

<div id="focusTab" class="tab-content" style="background: transparent; box-shadow: none; text-align: center;">
        
        <div id="focusWelcomeScreen" style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 60vh; width: 100%;">
            <button id="btnCenterPomoIcon" style="background: transparent; border: none; cursor: pointer; transition: transform 0.3s;" title="Mở Trạm Pomodoro Tự Do">
                <img src="icon-pomodoro.png" alt="Pomo Icon" style="width: 180px; height: 180px; object-fit: contain;">
            </button>
        </div>

        <div id="pomodoroUIWrapper" style="display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh;">
            
            <div class="clean-focus-box" style="position: relative; padding: 20px; max-width: 500px; width: 100%; margin: 0 auto; background: transparent; border: none; backdrop-filter: none; box-shadow: none;">
                <div id="focusTaskName" style="font-size: 20px; color: var(--accent); margin-bottom: 25px; font-weight: bold;">🎯 Tự do tập trung</div>
                
                <div style="display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 15px;">
                    <input type="number" id="inputTimer" value="25" min="1" max="180" style="width: 120px; font-size: 80px; border: none; text-align: right; color: var(--text-main); outline: none; background: transparent; font-weight: bold; font-family: inherit;">
                    <span style="font-size: 60px; color: var(--text-main); position: relative; top: -5px;">:</span>
                    <div id="timerSeconds" style="width: 120px; font-size: 80px; color: var(--text-main); font-weight: bold; text-align: left;">00</div>
                </div>

                <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 25px;">
                    <button class="focus-btn-mode active" id="btnModePomo" style="padding: 6px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.8); font-weight: bold; color: var(--text-main); pointer-events: none;">Pomodoro</button>
                    <button class="focus-btn-mode" id="btnModeBreak" style="padding: 6px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.8); font-weight: bold; color: var(--text-main); display: none; pointer-events: none;">Break Time</button>
                    <button id="btnResetTimer" style="padding: 6px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,77,77,0.1); color: var(--red); cursor: pointer; font-weight: bold; transition: 0.2s;">Reset</button>
                </div>

                <div style="font-size: 13px; color: #555; background: rgba(255,255,255,0.6); padding: 8px 18px; border-radius: 12px; display: inline-block; border: 1px solid var(--border);">
                    ⏱️ Tổng thời gian tích lũy: <span id="totalFocusTime" style="font-weight: bold; color: var(--accent);">0</span> phút
                </div>
            </div>

            <div style="margin-top: 40px; display: flex; justify-content: center; align-items: center; gap: 35px;">
                <button id="btnExitFocus" style="background: transparent; border: none; cursor: pointer; padding: 0; transition: transform 0.2s;" title="Quay lại Theme chính">
                    <img src="nut-back.png" alt="Back" style="width: 100px; height: 100px; object-fit: contain;">
                </button>
                <button id="btnTimerStart" style="background: transparent; border: none; cursor: pointer; padding: 0; transition: transform 0.2s;" title="Bắt đầu">
                    <img src="nut-start.png" alt="Start" style="width: 100px; height: 100px; object-fit: contain;">
                </button>
                <button id="btnTimerPause" style="background: transparent; border: none; cursor: pointer; padding: 0; transition: transform 0.2s;" title="Tạm dừng">
                    <img src="nut-pause.png" alt="Pause" style="width: 100px; height: 100px; object-fit: contain;">
                </button>
            </div>

        </div>
    </div>
    <div id="daily" class="tab-content active">
        <div class="input-row">
            <input type="text" id="dailyInput" class="input-item" placeholder="Hôm nay cần làm gì Babi ơi?">
           <input type="number" id="dailyTime" placeholder="Phút" class="input-time" style="width: 80px; text-align: center;">
            <select id="dailyPrio" class="input-prio">
                <option value="high">🔴 Quan trọng</option>
                <option value="medium" selected>🟡 Trong 12 tiếng</option>
                <option value="low">🔵 Trong ngày</option>
            </select>
            <button class="btn-add-main" id="btnDailyAdd">Thêm</button>
        </div>
        <div id="dailyList"></div>
        <div class="history-section">
            <button class="history-btn" id="btnToggleHistory">👁️ Xem / Ẩn lịch sử công việc đã xóa</button>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <div id="weekly" class="tab-content">
        <div class="weekly-grid" id="weekGrid"></div>
    </div>

    <div id="monthly" class="tab-content">
        <div class="cal-nav">
            <button id="btnPrevMonth">◀ Trước</button>
            <h3 id="monthYearDisplay" style="color: var(--accent); margin: 0 20px;">Tháng ...</h3>
            <button id="btnNextMonth">Sau ▶</button>
        </div>
        <div class="calendar-grid" id="calGrid"></div>
    </div>
  <div id="summary" class="tab-content" style="background: transparent; box-shadow: none;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
            
            <div class="summary-card" style="background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(8px); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                <h3 class="sum-title" style="color: var(--accent); margin-bottom: 15px; font-size: 16px; border-bottom: 1px dashed var(--border); padding-bottom: 8px;">☀️ Việc Hôm Nay</h3>
                <div id="sumDailyList" class="sum-list"></div>
            </div>

            <div class="summary-card" style="background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(8px); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                <h3 class="sum-title" style="color: var(--accent); margin-bottom: 15px; font-size: 16px; border-bottom: 1px dashed var(--border); padding-bottom: 8px;">📅 Kế Hoạch Tuần</h3>
                <div id="sumWeeklyList" class="sum-list"></div>
            </div>

            <div class="summary-card" style="background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(8px); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                <h3 class="sum-title" style="color: var(--accent); margin-bottom: 15px; font-size: 16px; border-bottom: 1px dashed var(--border); padding-bottom: 8px;">🗓️ Lịch Quan Trọng</h3>
                <div id="sumMonthlyList" class="sum-list"></div>
            </div>

        </div>
    </div>
    
    <div id="circleProgressContainer" class="circle-progress-wrapper"></div>
    
<div id="wkModal" class="theme-modal-overlay" style="display:none; align-items:center; justify-content:center; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:999;">
        <div class="theme-modal" style="background:white; padding:20px; border-radius:12px; width:90%; max-width:400px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
            <h3 id="wkModalTitle" style="color:var(--accent); margin-bottom:15px; font-size:18px;">Thêm việc tuần</h3>
            
            <input type="text" id="wkInput" placeholder="Nội dung công việc..." style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid var(--border); outline:none;">
            
            <div style="display:flex; gap:10px; margin-bottom:15px; align-items: center;">
                <div style="flex: 1;">
                    <label style="font-size: 12px; color: #666; font-weight: bold;">Bắt đầu:</label>
                    <input type="time" id="wkTime" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); outline:none;">
                </div>
                <span style="font-weight: bold; color: #999; margin-top: 15px;">-</span>
                <div style="flex: 1;">
                    <label style="font-size: 12px; color: #666; font-weight: bold;">Kết thúc:</label>
                    <input type="time" id="wkTimeEnd" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); outline:none;">
                </div>
            </div>

            <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="wkHighlight" style="width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer;">
                <label for="wkHighlight" style="font-size: 13px; color: #555; cursor: pointer; font-weight: bold;">🌟 Nổi bật với màu:</label>
                <input type="color" id="wkColor" value="#ffea00" style="width: 25px; height: 25px; border: none; cursor: pointer; padding: 0; background: transparent;" title="Nhấn để chọn màu hoặc dán mã">
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button id="btnWkCancel" style="padding:8px 15px; border-radius:6px; border:none; background:#eee; cursor:pointer; font-weight:bold;">Hủy</button>
                <button id="btnWkSave" style="padding:8px 15px; border-radius:6px; border:none; background:var(--accent); color:white; cursor:pointer; font-weight:bold;">Lưu</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="timer.js"></script>
    <script src="progress.js"></script>
    <script src="nhat_ky.js"></script>
    <script src="list.js"></script>
    <script src="theme.js"></script>
    <script src="focus.js"></script>
    <script src="summary.js"></script>
</body>
</html>
