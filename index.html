<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rei 🌸</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nhat_ky.css">
    <link rel="stylesheet" href="progress.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div class="header">
        <h1>
            <span id="siteTitle" style="cursor: pointer;" title="Nhấn đúp để đổi tên">Rei</span> 
            <span class="secret-flower" id="secretTrigger" title="Chỉ là bông hoa thôi... đúng không?">🌸</span>
        </h1>
        <div class="clock-box" id="vnClock">Đang tải giờ...</div>
        <div class="goal-container">
            <span class="goal-text" id="myGoal" style="cursor: pointer;" title="Nhấn đúp để chỉnh sửa">Mục tiêu: Kiếm việc! Kiếm 100 triệu đầu tiên!</span>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn" id="tabFocusBtn">Trạm Tập Trung</button>
        <button class="tab-btn active" id="tabDailyBtn">Việc Hôm Nay</button>
        <button class="tab-btn" id="tabWeeklyBtn">Kế Hoạch Tuần</button>
        <button class="tab-btn" id="tabMonthlyBtn">Lịch Quan Trọng</button>
        <button class="tab-btn" id="tabSummaryBtn">Tổng Hợp</button>
    </div>

<div id="focusTab" class="tab-content" style="background: transparent; box-shadow: none; text-align: center;">
        <div class="clean-focus-box" style="position: relative; padding: 40px; background: rgba(255, 255, 255, 0.4); border-radius: 20px; border: 1px solid var(--border); max-width: 500px; margin: 0 auto; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);">
            
            <div id="focusTaskName" style="font-size: 20px; color: var(--accent); margin-bottom: 25px; font-weight: bold;">🎯 Sẵn sàng tập trung chưa babi?</div>
            
            <div style="display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 15px;">
                <input type="number" id="inputTimer" value="25" min="1" max="180" style="width: 120px; font-size: 80px; border: none; text-align: right; color: var(--text-main); outline: none; background: transparent; font-weight: bold; font-family: inherit;">
                <span style="font-size: 60px; color: var(--text-main); position: relative; top: -5px;">:</span>
                <div id="timerSeconds" style="width: 120px; font-size: 80px; color: var(--text-main); font-weight: bold; text-align: left;">00</div>
            </div>

            <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 25px;">
                <button class="focus-btn-mode active" id="btnModePomo" style="padding: 6px 14px; border-radius: 12px; border: 1px solid var(--border); background: white; font-weight: bold; color: var(--text-main); pointer-events: none;">Pomodoro</button>
                <button class="focus-btn-mode" id="btnModeBreak" style="padding: 6px 14px; border-radius: 12px; border: 1px solid var(--border); background: white; font-weight: bold; color: var(--text-main); display: none; pointer-events: none;">Break Time</button>
                <button id="btnResetTimer" style="padding: 6px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,77,77,0.1); color: var(--red); cursor: pointer; font-weight: bold; transition: 0.2s;">Reset</button>
            </div>

            <div style="font-size: 13px; color: #555; background: rgba(255,255,255,0.6); padding: 8px 18px; border-radius: 12px; display: inline-block; border: 1px solid var(--border);">
                ⏱️ Tổng thời gian tích lũy: <span id="totalFocusTime" style="font-weight: bold; color: var(--accent);">0</span> phút
            </div>
            
        </div>

        <div style="margin-top: 40px; display: flex; justify-content: center; align-items: center; gap: 35px;">
            <button id="btnExitFocus" style="background: transparent; border: none; cursor: pointer; padding: 0; transition: transform 0.2s;" title="Quay lại Theme chính">
                <img src="nut-back.png" alt="Back" style="width: 60px; height: 60px; object-fit: contain;">
            </button>
            <button id="btnTimerStart" style="background: transparent; border: none; cursor: pointer; padding: 0; transition: transform 0.2s;" title="Bắt đầu">
                <img src="nut-start.png" alt="Start" style="width: 60px; height: 60px; object-fit: contain;">
            </button>
            <button id="btnTimerPause" style="background: transparent; border: none; cursor: pointer; padding: 0; transition: transform 0.2s;" title="Tạm dừng">
                <img src="nut-pause.png" alt="Pause" style="width: 60px; height: 60px; object-fit: contain;">
            </button>
        </div>
    </div>
    <div id="daily" class="tab-content active">
        <div class="input-row">
            <input type="text" id="dailyInput" class="input-item" placeholder="Hôm nay cần làm gì Babi ơi?">
            <input type="time" id="dailyTime" class="input-time">
            <select id="dailyPrio" class="input-prio">
                <option value="high">🔴 Quan trọng</option>
                <option value="medium" selected>🟡 Trong 12 tiếng</option>
                <option value="low">🔵 Trong ngày</option>
            </select>
            <button class="btn-add-main" id="btnDailyAdd">Thêm</button>
        </div>
        <div id="dailyList"></div>
        <div class="history-section">
            <button class="history-btn" id="btnToggleHistory">👁️ Xem / Ẩn lịch sử công việc đã xóa</button>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <div id="weekly" class="tab-content">
        <div class="weekly-grid" id="weekGrid"></div>
    </div>

    <div id="monthly" class="tab-content">
        <div class="cal-nav">
            <button id="btnPrevMonth">◀ Trước</button>
            <h3 id="monthYearDisplay" style="color: var(--accent); margin: 0 20px;">Tháng ...</h3>
            <button id="btnNextMonth">Sau ▶</button>
        </div>
        <div class="calendar-grid" id="calGrid"></div>
    </div>
<div id="summaryTab" class="tab-content" style="background: transparent; box-shadow: none;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
            
            <div class="summary-card">
                <h3 class="sum-title">☀️ Việc Hôm Nay</h3>
                <div id="sumDailyList" class="sum-list"></div>
            </div>

            <div class="summary-card">
                <h3 class="sum-title">📅 Kế Hoạch Tuần</h3>
                <div id="sumWeeklyList" class="sum-list"></div>
            </div>

            <div class="summary-card">
                <h3 class="sum-title">🗓️ Lịch Quan Trọng</h3>
                <div id="sumMonthlyList" class="sum-list"></div>
            </div>

        </div>
    </div>
    
    <div id="circleProgressContainer" class="circle-progress-wrapper"></div>
    
    <div id="wkModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="wkModalTitle">Thêm việc mới</h3>
            <input type="text" id="wkInput" class="input-item" placeholder="Tên công việc...">
            <div style="display: flex; gap: 10px;">
                <input type="time" id="wkTime" class="input-time" style="flex: 1;">
                <select id="wkPrio" class="input-prio" style="flex: 1;">
                    <option value="high">🔴 Quan trọng</option>
                    <option value="medium" selected>🟡 Cần thiết</option>
                    <option value="low">🔵 Có thể delay</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-add-main" style="flex: 1;" id="btnWkSave">Lưu</button>
                <button class="btn-add-main" style="flex: 1; background: #999;" id="btnWkCancel">Hủy</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="timer.js"></script>
    <script src="progress.js"></script>
    <script src="nhat_ky.js"></script>
    <script src="list.js"></script>
    <script src="theme.js"></script>
    <script src="focus.js"></script>
    <script src="summary.js"></script>
</body>
</html>
